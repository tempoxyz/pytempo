name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    environment: pypi
    # The changelog-release version PR, branch, tags, and GitHub releases are
    # created with a short-lived GitHub App token minted via the github-sts
    # action (authorized by .github/sts/release-pr.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC) and the STS exchange
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          policy: release-pr

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - uses: tempoxyz/changelogs@cdd0dd01199fd0d23b5d8bec7cf5dbe79d242dc0 # OIDC trusted publishing and system CA verification
        with:
          ecosystem: python
          python-version: '3.12'
          conventional-commit: true
          github-token: ${{ steps.app-token.outputs.token }}
