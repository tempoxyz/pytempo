[project]
name = "pytempo"
version = "0.8.0"
description = "Python SDK for Tempo, the stablecoin payments blockchain: build, sign and send Tempo transactions and TIP-20 stablecoin payments with web3.py"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "eth-abi>=5.0.0",
    "eth-account>=0.13.1",
    "eth-utils>=4.0.0",
    "rlp>=4.0.0",
    "attrs>=23.0.0",
    "pycryptodome>=3.20",
]
authors = [
    {name = "Tempo"}
]
license = {text = "MIT OR Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
keywords = [
    "tempo",
    "web3",
    "web3py",
    "ethereum",
    "evm",
    "blockchain",
    "stablecoin",
    "payments",
    "stablecoin-payments",
    "tip-20",
    "sdk",
]

[project.optional-dependencies]
web3 = ["web3>=7.0.0"]

[project.urls]
Homepage = "https://tempo.com"
Documentation = "https://tempo.com/developers/docs/sdk/python"
Repository = "https://github.com/tempoxyz/pytempo"
Issues = "https://github.com/tempoxyz/pytempo/issues"
Changelog = "https://github.com/tempoxyz/pytempo/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".jj"]
artifacts = ["pytempo/contracts/abis/*.json"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.legacy",
]

[dependency-groups]
dev = [
    "web3>=7.0.0",
    "pytest>=8.4.2",
    "ruff>=0.14.6",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
]
